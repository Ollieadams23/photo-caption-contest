<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <header>
        <h1>Photo Caption Contest</h1>
    </header>
    <!-- Include navbar.html -->
    <div id="navbar-container"></div>
    <script>
        fetch('/navbar.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navbar-container').innerHTML = html;
            });
    </script>

    <div style="display: flex; justify-content: center; gap: 3em; flex-wrap: wrap;">
        <div style="border: 1px solid #ccc; border-radius: 8px; padding: 2em; min-width: 300px; background: #fafbfc; box-shadow: 0 2px 8px #eee;">
            <h2 style="text-align:center;">Login</h2>
            <form action="/auth/login" method="POST" style="display: flex; flex-direction: column; gap: 1em;">
                <label for="login-email">Email:</label>
                <input type="email" id="login-email" name="email" required>
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" name="password" minlength="4" required>
                <input type="submit" value="Login" style="margin-top: 1em;">
            </form>
        </div>
        <div style="border: 1px solid #ccc; border-radius: 8px; padding: 2em; min-width: 300px; background: #fafbfc; box-shadow: 0 2px 8px #eee;">
            <h2 style="text-align:center;">Register</h2>
            <form action="/auth/register" method="POST" style="display: flex; flex-direction: column; gap: 1em;">
                <label for="register-username">Username:</label>
                <input type="text" id="register-username" name="username" required>
                <label for="register-email">Email:</label>
                <input type="email" id="register-email" name="email" required>
                <label for="register-password">Password:</label>
                <input type="password" id="register-password" name="password" minlength="6" required>
                <input type="submit" value="Register" style="margin-top: 1em;">
            </form>
        </div>
    </div>

</body>
</html>
